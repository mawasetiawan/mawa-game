name: Sync developer settings

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mawa-game-settings
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Snapshot Firebase settings
        run: |
          curl --fail --show-error --silent --max-time 30 \
            https://mawa-game-default-rtdb.asia-southeast1.firebasedatabase.app/gameSettings.json \
            -o "$RUNNER_TEMP/game-settings.json"
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { fields, parseSettings } from './docs/game-settings.mjs';
          const live = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/game-settings.json', 'utf8'));
          if (live !== null) {
            const next = parseSettings(live);
            const matches = Object.keys(fields).every(key => live[key] === next[key]);
            if (!matches) throw new Error('Unexpected Firebase settings');
            writeFileSync('docs/settings.json', JSON.stringify(next, null, 2) + '\n');
          }
          JS
          if git diff --quiet -- docs/settings.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/settings.json
          git commit -m 'Sync developer settings from Firebase'
          git pull --rebase origin main
          git push origin HEAD:main
