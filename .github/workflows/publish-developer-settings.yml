name: Publish Developer settings

on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-developer-settings
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Commit the latest settings
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --hard origin/main
            node .github/scripts/publish-developer-settings.mjs
            if [ -z "$(git status --porcelain -- docs/developer-settings.json .github/developer-settings-publication.json)" ]; then
              exit 0
            fi
            git add -- docs/developer-settings.json .github/developer-settings-publication.json
            git commit -m 'Publish Developer settings'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
