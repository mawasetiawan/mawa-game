<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Mawa Game</title>
<link rel="stylesheet" href="./style.css?v=chatroom1">
</head>
<body>
<main>
  <header><a class="brand" href="./">MAWA GAME</a><div id="account" class="account" hidden></div><button id="logout" hidden>Keluar</button></header>
  <section id="gate" class="center panel">
    <h1>Masuk ke Mawa Game</h1>
    <button id="login" disabled>Masuk dengan Google</button>
  </section>
  <section id="loading" class="center" hidden aria-live="polite">
    <span class="spinner" aria-hidden="true"></span><h1>Memuat game</h1><p id="loadingText">Menyiapkan koneksi lobby…</p>
  </section>
  <section id="menu" class="lobby" hidden>
    <div class="hero panel">
      <h1>Menu Utama</h1>
      <button id="createParty">Buat Party</button>
      <section id="party" class="party" hidden aria-label="Party">
        <h2 id="partyTitle">Party</h2><ul id="roster"></ul><p id="partyHint"></p>
        <div class="party-actions"><button id="play" hidden>Masuk ke Map</button><button id="leaveParty">Keluar Party</button></div>
      </section>
    </div>
    <aside class="panel dock" aria-label="Pemain online">
      <h2>Pemain online <span id="count"></span></h2>
      <ul id="players"></ul>
      <div id="invitations" hidden><h2>Undangan party</h2><ul id="invites"></ul></div>
    </aside>
  </section>
  <section id="world" class="world" hidden>
    <canvas class="map" aria-label="Map eksplorasi 3D"></canvas>
    <p id="mapNotice" class="map-notice" role="status"></p>
    <p id="mapError" class="map-error" role="status" hidden></p>
    <div class="world-toolbar"><button id="back">Keluar dari Map</button><span id="mapTitle">Map Kosong</span><button id="fullscreen" type="button" aria-pressed="false">Fullscreen</button><button id="openDeveloper" type="button" aria-controls="developerPanel" aria-expanded="false" hidden>Developer</button></div>
    <div class="controls" aria-label="Kontrol eksplorasi">
      <div id="joystick" class="joystick" aria-label="Joystick gerak"><span aria-hidden="true"></span></div>
      <div id="actions" class="actions" data-mode="exploration" aria-label="Aksi eksplorasi">
        <button type="button" data-action="jump">Lompat</button>
        <button type="button" data-action="walk" aria-pressed="false">Jalan</button>
        <button type="button" data-action="sprint" aria-label="Sprint, tekan dan tahan">Sprint</button>
        <button type="button" data-action="interact">Interaksi</button>
      </div>
    </div>
    <section id="developerPanel" class="developer-panel panel" aria-label="Pengaturan Developer" hidden>
      <h2>Pengaturan Developer</h2>
      <form><div class="developer-fields"></div><button type="submit">Simpan</button><p role="status"></p></form>
    </section>
    <section id="chat" class="panel chat" aria-label="Chat Room">
<ol id="messages" role="log" aria-label="Riwayat chat room" aria-relevant="additions"></ol>
<form id="composer">
<textarea id="message" rows="1" required maxlength="500" enterkeyhint="send" placeholder="Tulis pesan…" aria-label="Pesan"></textarea>
<button id="send" type="submit" aria-label="Kirim" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 4 18 8-18 8 3-8-3-8zm3 8h15"/></svg></button>
<button id="chatToggle" type="button" aria-expanded="false" aria-controls="messages message send" aria-label="Open Chat">
<svg class="closed" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 9h8m-8 4h6m7-8v12a2 2 0 0 1-2 2H7l-4 3V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
<svg class="opened" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg><span>Open Chat</span>
</button>
</form>
</section>
  </section>
  <p id="status" role="status"></p>
</main>
<script type="module" src="./app.mjs?v=chatroom1"></script>
</body>
</html>
