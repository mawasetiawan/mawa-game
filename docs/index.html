<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Mawa Game</title>
<link rel="stylesheet" href="./style.css?v=fullscreen2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#101e26">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./mawa-icon-192.png">
</head>
<body>
<main>
  <header><a class="brand" href="./">MAWA GAME</a><div id="account" class="account" hidden></div><button id="logout" hidden>Keluar</button></header>
  <section id="gate" class="center panel">
    <h1>Masuk ke Mawa Game</h1>
    <button id="login" disabled>Masuk dengan Google</button>
  </section>
  <section id="loading" class="center" hidden aria-live="polite">
    <span class="spinner" aria-hidden="true"></span><h1>Memuat game</h1><p id="loadingText">Menyiapkan koneksi lobby…</p>
  </section>
  <section id="menu" class="lobby" hidden>
    <div class="hero panel">
      <h1>Menu Utama</h1>
      <button id="createParty">Buat Party</button>
      <section id="party" class="party" hidden aria-label="Party">
        <h2 id="partyTitle">Party</h2><ul id="roster"></ul><p id="partyHint"></p>
        <div class="party-actions"><button id="play" hidden>Masuk ke Map</button><button id="leaveParty">Keluar Party</button></div>
      </section>
    </div>
    <aside class="panel dock" aria-label="Pemain online">
      <h2>Pemain online <span id="count"></span></h2>
      <ul id="players"></ul>
      <div id="invitations" hidden><h2>Undangan party</h2><ul id="invites"></ul></div>
    </aside>
  </section>
  <section id="world" class="world" hidden>
    <canvas class="map" aria-label="Map eksplorasi 3D"></canvas>
    <p id="mapNotice" class="map-notice" role="status"></p>
    <p id="mapError" class="map-error" role="status" hidden></p>
    <!-- HUD icons adapted from Tabler Icons (MIT). Copyright (c) 2020 Paweł Kuna. https://github.com/tabler/tabler-icons/blob/main/LICENSE -->
    <div class="gameplay-hud">
    <div class="hud-top">
      <div class="hud-tag"><small>EKSPLORASI</small><h2 id="mapTitle">Map Kosong</h2></div>
      <div class="hud-compass" aria-hidden="true">· &nbsp; N &nbsp; ·</div>
      <nav class="world-toolbar" aria-label="Kontrol HUD">
        <button id="back" type="button" aria-label="Keluar dari Map"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg><span>Keluar dari Map</span></button>
        <button id="openDeveloper" type="button" aria-label="Developer" aria-controls="developerPanel" aria-expanded="false" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16M8 4v4m8 2v4m-6 2v4"/></svg><span>Developer</span></button>
        <button id="fullscreen" type="button" aria-label="Fullscreen" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5m6 0h5v5m0 6v5h-5m-6 0H4v-5"/></svg><span>Fullscreen</span></button>
      </nav>
    </div>
    <div class="controls" aria-label="Kontrol eksplorasi">
      <div id="joystick" class="joystick" aria-label="Joystick gerak"><span aria-hidden="true"></span></div>
      <div id="actions" class="actions" data-mode="exploration" aria-label="Aksi eksplorasi">
        <button type="button" data-action="jump"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17V4m-5 5 5-5 5 5M5 21h14"/></svg><span>Lompat</span></button>
        <button type="button" data-action="walk" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="13" cy="4" r="2"/><path d="m7 21 3-5m6 5-2-4-3-3 1-6m-6 6 6-6 4 4h3"/></svg><span>Jalan</span></button>
        <button type="button" data-action="sprint" aria-label="Sprint, tekan dan tahan"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m13 2-8 12h6l-1 8 9-12h-6l1-8"/></svg><span>Sprint</span></button>
        <button type="button" data-action="interact"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 13V5a2 2 0 0 1 4 0v6-2a2 2 0 0 1 4 0v2a2 2 0 0 1 4 0v4a7 7 0 0 1-14 2l-2-4a2 2 0 0 1 4-1"/></svg><span>Interaksi</span></button>
      </div>
    </div>
    <section id="developerPanel" class="developer-panel panel" aria-label="Pengaturan Developer" hidden>
      <header><div><h2>Pengaturan Developer</h2><p>Game Master</p></div><button type="button" data-close-developer aria-label="Tutup pengaturan"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header>
      <form><div class="developer-fields"></div><button class="save" type="submit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h11l3 3v13H4V4h2m2 0v6h8V4m-8 16v-6h8v6"/></svg>Simpan</button><p role="status"></p></form>
    </section>
    <section id="chat" class="panel chat" aria-label="Chat Room">
<ol id="messages" role="log" aria-label="Riwayat chat room" aria-relevant="additions"></ol>
<form id="composer">
<textarea id="message" rows="1" required maxlength="500" enterkeyhint="send" placeholder="Tulis pesan…" aria-label="Pesan"></textarea>
<button id="send" type="submit" aria-label="Kirim" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 4 18 8-18 8 3-8-3-8zm3 8h15"/></svg></button>
<button id="chatToggle" type="button" aria-expanded="false" aria-controls="messages message send" aria-label="Open Chat">
<svg class="closed" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 9h8m-8 4h6m7-8v12a2 2 0 0 1-2 2H7l-4 3V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
<svg class="opened" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg><span>Open Chat</span>
</button>
</form>
</section>
    </div>
  </section>
  <p id="status" role="status"></p>
</main>
<script type="module" src="./app.mjs?v=fullscreen2"></script>
</body>
</html>
